name: Sync product apps

on:
  schedule:
    - cron: '45 0 * * *'  # 06:15 IST daily - after Sarkari-Sarthi's 05:00 IST update
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-products.yml'

permissions:
  contents: write

concurrency:
  group: sync-products
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central site
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Checkout Arrow Out source (Fletch_Game)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: parya5103/Fletch_Game
          ref: main
          path: src-arrowout

      - name: Checkout Crystal Quest source (crystal-quest-web)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: parya5103/crystal-quest-web
          ref: main
          path: src-crystalquest

      - name: Checkout Sarkari Sarthi published site (gh-pages branch)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          repository: parya5103/Sarkari-Sarthi
          ref: gh-pages
          path: src-sarkari

      - name: Publish Arrow Out into /arrowout/
        run: |
          mkdir -p arrowout
          rsync -a --delete --delete-excluded \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'android' \
            --exclude 'audit' \
            --exclude 'scripts' \
            --exclude 'tests' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            --exclude 'SECURITY.md' \
            --exclude '.gitignore' \
            src-arrowout/ arrowout/

      - name: Publish Crystal Quest into /crystalquest/
        run: |
          mkdir -p crystalquest
          rsync -a --delete --delete-excluded \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'android' \
            --exclude 'dev' \
            --exclude 'tests' \
            --exclude 'README.md' \
            --exclude 'KNOWLEDGE.md' \
            --exclude '.gitignore' \
            src-crystalquest/ crystalquest/

      - name: Publish Sarkari Sarthi into /sarkari-sarthi/
        run: |
          mkdir -p sarkari-sarthi
          rsync -a --delete --delete-excluded \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.nojekyll' \
            --exclude '.jules' \
            --exclude '.vercelignore' \
            --exclude 'AGENTS.md' \
            --exclude 'LICENSE' \
            --exclude 'daily_review.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'pnpm-lock.yaml' \
            --exclude 'vercel.json' \
            --exclude 'tests' \
            --exclude 'CNAME' \
            src-sarkari/ sarkari-sarthi/

      - name: Verify synced product files (fail instead of publishing broken apps)
        run: |
          set -e
          test -f arrowout/index.html
          test -f arrowout/manifest.webmanifest
          test -f arrowout/sw.js
          test -f arrowout/js/game.js
          test -f arrowout/js/main.js
          test -f arrowout/css/styles.css
          test -f arrowout/icons/icon-192.png
          test -f crystalquest/index.html
          test -f crystalquest/manifest.json
          test -f crystalquest/sw.js
          test -f crystalquest/js/engine.js
          test -f crystalquest/js/main.js
          test -f crystalquest/styles.css
          test -f crystalquest/icon.svg
          test -f sarkari-sarthi/index.html
          test -f sarkari-sarthi/script.js
          test -f sarkari-sarthi/style.css
          test -f sarkari-sarthi/jobs/job_manifest.json
          # GoGo Central notifications pairing (guard: the module and its FCM
          # worker arrive from the upstream product repos after their
          # central-notifications merges; until then both are absent and these
          # checks pass).
          if [ -f arrowout/js/gogo-notifications.js ] && [ ! -f arrowout/fcm/firebase-messaging-sw.js ]; then
            echo "::error::Arrow Out notifications module synced without its service worker"
            exit 1
          fi
          if [ -f crystalquest/js/gogo-notifications.js ] && [ ! -f crystalquest/fcm/firebase-messaging-sw.js ]; then
            echo "::error::Crystal Quest notifications module synced without its service worker"
            exit 1
          fi
          if [ -f sarkari-sarthi/gogo-notifications.js ] && [ ! -f sarkari-sarthi/firebase-messaging-sw.js ]; then
            echo "::error::Sarkari Sarthi notifications module synced without its service worker"
            exit 1
          fi
          echo "All key product files verified."

      - name: Commit synced apps if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Drop any stale index entries (gitlinks from the broken first sync,
          # or file entries from previous runs) so git add stages fresh trees.
          # Without this, git add silently skips paths whose index entry is a
          # gitlink (mode 160000) even though .git is no longer present.
          git rm -r --cached --ignore-unmatch --quiet arrowout crystalquest sarkari-sarthi || true
          git add arrowout crystalquest sarkari-sarthi
          if git ls-files -s | grep -q '^160000'; then
            echo "::error::gitlink (embedded repository) entries present in index - refusing to publish"
            git ls-files -s | grep '^160000' || true
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "No product changes to publish."
          else
            git commit -m "sync: refresh product apps from source repositories"
            git pull --rebase origin main
            git push
          fi

