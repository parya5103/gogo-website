name: Sync product apps

on:
  schedule:
    - cron: '45 0 * * *'  # 06:15 IST daily - after Sarkari-Sarthi's 05:00 IST update
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/sync-products.yml'

permissions:
  contents: write
  id-token: write

concurrency:
  group: sync-products
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout central site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Re-runs must start from the latest main, not the original failed SHA.
          # The previous attempt may already have published its product commit.
          ref: main

      - name: Checkout Arrow Out source (Fletch_Game)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: parya5103/Fletch_Game
          ref: main
          path: src-arrowout

      - name: Checkout Crystal Quest source (crystal-quest-web)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: parya5103/crystal-quest-web
          ref: main
          path: src-crystalquest

      - name: Checkout Sarkari Sarthi published site (gh-pages branch)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: parya5103/sarkarisarthi
          ref: gh-pages
          path: src-sarkari

      - name: Publish Arrow Out into /arrowout/
        run: |
          mkdir -p arrowout
          rsync -a --delete --delete-excluded \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'android' \
            --exclude 'audit' \
            --exclude 'scripts' \
            --exclude 'tests' \
            --exclude 'README.md' \
            --exclude 'LICENSE' \
            --exclude 'SECURITY.md' \
            --exclude '.gitignore' \
            src-arrowout/ arrowout/

      - name: Publish Crystal Quest into /crystalquest/
        run: |
          mkdir -p crystalquest
          rsync -a --delete --delete-excluded \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'android' \
            --exclude 'dev' \
            --exclude 'tests' \
            --exclude 'README.md' \
            --exclude 'KNOWLEDGE.md' \
            --exclude '.gitignore' \
            src-crystalquest/ crystalquest/

      - name: Publish Sarkari Sarthi into /sarkari-sarthi/
        run: |
          mkdir -p sarkari-sarthi
          # These GoGo Central FCM assets are maintained centrally until the
          # product source ships its own copies. Preserve them across rsync
          # --delete; prefer upstream files automatically if they are added.
          SARKARI_NOTIFICATION_BACKUP="$RUNNER_TEMP/sarkari-notifications"
          mkdir -p "$SARKARI_NOTIFICATION_BACKUP"
          for file in firebase-messaging-sw.js gogo-notifications.js; do
            if [ -f "sarkari-sarthi/$file" ]; then
              cp "sarkari-sarthi/$file" "$SARKARI_NOTIFICATION_BACKUP/$file"
            fi
          done
          rsync -a --delete --delete-excluded \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.gitignore' \
            --exclude '.nojekyll' \
            --exclude '.jules' \
            --exclude '.vercelignore' \
            --exclude 'AGENTS.md' \
            --exclude 'LICENSE' \
            --exclude 'daily_review.md' \
            --exclude 'package.json' \
            --exclude 'package-lock.json' \
            --exclude 'pnpm-lock.yaml' \
            --exclude 'vercel.json' \
            --exclude 'tests' \
            --exclude 'CNAME' \
            src-sarkari/ sarkari-sarthi/
          for file in firebase-messaging-sw.js gogo-notifications.js; do
            if [ ! -f "sarkari-sarthi/$file" ] && [ -f "$SARKARI_NOTIFICATION_BACKUP/$file" ]; then
              cp "$SARKARI_NOTIFICATION_BACKUP/$file" "sarkari-sarthi/$file"
            fi
          done

      - name: Apply persistent SEO enhancements after sync
        run: node scripts/apply-seo-enhancements.mjs

      - name: Verify synced product files (fail instead of publishing broken apps)
        run: |
          set -e
          test -f arrowout/index.html
          test -f arrowout/manifest.webmanifest
          test -f arrowout/sw.js
          test -f arrowout/js/game.js
          test -f arrowout/js/main.js
          test -f arrowout/css/styles.css
          test -f arrowout/icons/icon-192.png
          test -f crystalquest/index.html
          test -f crystalquest/manifest.json
          test -f crystalquest/sw.js
          test -f crystalquest/js/engine.js
          test -f crystalquest/js/main.js
          test -f crystalquest/styles.css
          test -f crystalquest/icon.svg
          test -f crystalquest/icon-192.png
          test -f crystalquest/icon-512.png
          test -f crystalquest/icon-512-maskable.png
          test -f crystalquest/privacy.html
          test -f crystalquest/terms.html
          test -f sarkari-sarthi/index.html
          test -f sarkari-sarthi/script.js
          test -f sarkari-sarthi/style.css
          test -f sarkari-sarthi/jobs/job_manifest.json
          # GoGo Central notifications pairing (guard: the module and its FCM
          # worker arrive from the upstream product repos after their
          # central-notifications merges; until then both are absent and these
          # checks pass).
          if [ -f arrowout/js/gogo-notifications.js ] && [ ! -f arrowout/fcm/firebase-messaging-sw.js ]; then
            echo "::error::Arrow Out notifications module synced without its service worker"
            exit 1
          fi
          if [ -f crystalquest/js/gogo-notifications.js ] && [ ! -f crystalquest/fcm/firebase-messaging-sw.js ]; then
            echo "::error::Crystal Quest notifications module synced without its service worker"
            exit 1
          fi
          if [ -f sarkari-sarthi/gogo-notifications.js ] && [ ! -f sarkari-sarthi/firebase-messaging-sw.js ]; then
            echo "::error::Sarkari Sarthi notifications module synced without its service worker"
            exit 1
          fi
          # Reject substring-based FCM client URL allowlists in every published app.
          for worker in arrowout/fcm/firebase-messaging-sw.js crystalquest/fcm/firebase-messaging-sw.js sarkari-sarthi/firebase-messaging-sw.js; do
            test -f "$worker"
            if grep -Fq 'client.url.indexOf' "$worker"; then
              echo "::error::$worker still uses unsafe URL substring matching"
              exit 1
            fi
            grep -Fq 'function isTrustedClientUrl' "$worker"
            grep -Fq "parsed.protocol === 'https:'" "$worker"
            grep -Fq "parsed.hostname === 'gogocompany.in'" "$worker"
            grep -Fq 'parsed.origin === self.location.origin' "$worker"
          done
          echo "All key product files verified."

      - name: Generate fresh homepage trends and programmatic SEO hubs
        run: |
          node scripts/update-trending-seo.mjs
          node scripts/generate-pseo-hubs.mjs

      - name: Refresh SEO sitemap and notify IndexNow
        run: node scripts/seo-sync-ping.mjs

      - name: Commit synced apps if changed
        id: publish
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Drop any stale index entries (gitlinks from the broken first sync,
          # or file entries from previous runs) so git add stages fresh trees.
          # Without this, git add silently skips paths whose index entry is a
          # gitlink (mode 160000) even though .git is no longer present.
          git rm -r --cached --ignore-unmatch --quiet arrowout crystalquest sarkari-sarthi || true
          git add arrowout crystalquest sarkari-sarthi sitemap.xml index.html free-online-games
          if git ls-files -s | grep -q '^160000'; then
            echo "::error::gitlink (embedded repository) entries present in index - refusing to publish"
            git ls-files -s | grep '^160000' || true
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No product changes to publish."
          else
            git commit -m "sync: refresh product apps from source repositories"
            git pull --rebase --autostash origin main
            git push
            if ! git diff HEAD^ HEAD --quiet -- arrowout crystalquest sarkari-sarthi free-online-games; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
            else
              echo "changed=false" >> "$GITHUB_OUTPUT"
            fi
          fi


      - name: Send GoGo Central product update notification
        if: steps.publish.outputs.changed == 'true' && success()
        env:
          CENTRAL_API: https://gogo-central-backend.onrender.com
        run: |
          set -euo pipefail
          OIDC_URL="${ACTIONS_ID_TOKEN_REQUEST_URL}&audience=gogo-central-notifications"
          OIDC_TOKEN=$(curl -fsS -H "Authorization: bearer ${ACTIONS_ID_TOKEN_REQUEST_TOKEN}" "$OIDC_URL" | jq -r '.value')
          EVENT_ID=$(git rev-parse HEAD)
          jq -n --arg eventId "$EVENT_ID" \
            --arg title "GoGo Company में नया अपडेट" \
            --arg body "GoGo के products और website में नया update प्रकाशित हुआ है। अभी देखें।" \
            --arg deepLink "https://gogocompany.in/" \
            '{eventType:"product_update",eventId:$eventId,title:$title,body:$body,deepLink:$deepLink}' > /tmp/gogo-event.json
          curl --fail-with-body -sS --connect-timeout 10 --max-time 60 --retry 2 --retry-connrefused --retry-delay 5 -X POST "$CENTRAL_API/api/v1/automation/publish" \
            -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" \
            --data-binary @/tmp/gogo-event.json
