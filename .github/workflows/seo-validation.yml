name: SEO validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/validate-seo.mjs'
      - '.github/workflows/seo-validation.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/validate-seo.mjs'
      - '.github/workflows/seo-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check SEO script syntax
        run: node --check scripts/validate-seo.mjs
      - name: Validate homepage metadata, JSON-LD and sitemap
        run: node scripts/validate-seo.mjs
