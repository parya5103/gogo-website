name: SEO validation

on:
  pull_request:
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/validate-seo.mjs'
      - '.github/workflows/seo-validation.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap.xml'
      - 'robots.txt'
      - 'scripts/validate-seo.mjs'
      - '.github/workflows/seo-validation.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Check SEO script syntax
        run: node --check scripts/validate-seo.mjs
      - name: Validate homepage metadata, JSON-LD and sitemap
        run: node scripts/validate-seo.mjs
