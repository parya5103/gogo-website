name: SEO validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'assets/css/style.css'
      - 'package.json'
      - 'frontend/**'
      - 'vite.config.js'
      - 'free-online-games/**'
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'assets/css/ads.css'
      - 'scripts/**'
      - 'arrow-out/**'
      - 'crystal-quest/**'
      - 'sarkari/**'
      - 'arrowout/**'
      - 'crystalquest/**'
      - 'sarkari-sarthi/**'
      - 'pikanews/**'
      - '.github/workflows/seo-validation.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'assets/css/ads.css'
      - 'scripts/**'
      - 'arrow-out/**'
      - 'crystal-quest/**'
      - 'sarkari/**'
      - 'arrowout/**'
      - 'crystalquest/**'
      - 'sarkari-sarthi/**'
      - 'pikanews/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install build dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund
      - name: Build the prerendered homepage
        run: npm run build:site
      - name: Check Node.js script syntax
        run: |
          node --version
          node --check scripts/prerender-home.mjs
          node --check scripts/publish-site-build.mjs
          node --check scripts/apply-seo-enhancements.mjs
          node --check scripts/update-seo-sitemaps.mjs
          node --check scripts/seo-sync-ping.mjs
          node --check scripts/validate-seo.mjs
          node --check scripts/update-trending-seo.mjs
          node --check scripts/generate-pseo-hubs.mjs
          node --check scripts/generate-root-sitemap.mjs
          node --check scripts/test-seo-generators.mjs
          node --check scripts/validate-seo-build.mjs
          node --check scripts/generate-pikanews-news-sitemap.mjs
          node --check scripts/validate-pikanews-news-seo.mjs
          node --check scripts/validate-structured-data.mjs
          node --check scripts/test-jobposting-schema.mjs
          node --check scripts/sarkari-schema-injector.js
          node --check sarkari-sarthi/assets/js/sarkari-schema-injector.js
      - name: Apply post-sync SEO enhancements
        run: node scripts/apply-seo-enhancements.mjs
      - name: Test JobPosting schema generator
        run: node scripts/test-jobposting-schema.mjs
      - name: Generate trending content and pSEO hubs
        run: |
          node scripts/update-trending-seo.mjs
          node scripts/generate-pseo-hubs.mjs
          node scripts/generate-root-sitemap.mjs
      - name: Test SEO generator helpers
        run: node scripts/test-seo-generators.mjs
      - name: Generate and validate PikaNews news sitemap
        run: |
          node scripts/generate-pikanews-news-sitemap.mjs
          node scripts/validate-pikanews-news-seo.mjs
          node scripts/validate-structured-data.mjs
      - name: Validate generated SEO pages
        run: node scripts/validate-seo-build.mjs
      - name: Validate SEO implementation
        run: |
          node scripts/validate-seo.mjs
          node scripts/validate-all-canonicals.mjs
          node scripts/seo-tests.mjs
