name: SEO validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'assets/css/ads.css'
      - 'scripts/**'
      - 'arrow-out/**'
      - 'crystal-quest/**'
      - 'sarkari/**'
      - 'arrowout/**'
      - 'crystalquest/**'
      - 'sarkari-sarthi/**'
      - 'pikanews/**'
      - '.github/workflows/seo-validation.yml'
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'sitemap*.xml'
      - 'robots.txt'
      - 'assets/css/ads.css'
      - 'scripts/**'
      - 'arrow-out/**'
      - 'crystal-quest/**'
      - 'sarkari/**'
      - 'arrowout/**'
      - 'crystalquest/**'
      - 'sarkari-sarthi/**'
      - 'pikanews/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check Node.js script syntax
        run: |
          node --version
          node --check scripts/apply-seo-enhancements.mjs
          node --check scripts/update-seo-sitemaps.mjs
          node --check scripts/validate-seo.mjs
          node --check sarkari-sarthi/assets/js/sarkari-schema-injector.js
      - name: Apply post-sync SEO enhancements
        run: node scripts/apply-seo-enhancements.mjs
      - name: Validate SEO implementation
        run: node scripts/validate-seo.mjs
