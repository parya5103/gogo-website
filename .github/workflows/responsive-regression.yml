name: Responsive regression

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Playwright (no project dependency changes)
        run: npm install --no-save --no-package-lock --no-audit --no-fund --legacy-peer-deps playwright@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static server
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 > /tmp/gogo-http.log 2>&1 &
          echo $! > /tmp/gogo-http.pid
      - name: Audit all HTML viewport tags and responsive routes
        run: node scripts/responsive-smoke.mjs
