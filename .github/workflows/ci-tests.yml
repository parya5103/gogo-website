name: CI Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install repository dependencies
        run: npm install --no-save --no-package-lock --no-audit --no-fund

      - name: Build the React homepage and verify protected paths
        run: npm run build:site

      - name: Run all repository test suites
        run: |
          set +e
          npm test > test-output.log 2>&1
          code=$?
          set -e
          if [ "$code" -ne 0 ]; then
            tr -cd '\40-\176\n' < test-output.log | grep -E -A 6 '^FAIL:' | head -n 10 > ci-fail.txt || true
            tr -cd '\40-\176\n' < test-output.log | tail -n 12 >> ci-fail.txt || true
            n=0
            while IFS= read -r line && [ "$n" -lt 10 ]; do
              [ -n "$line" ] || continue
              printf '::error::%s\n' "$line"
              n=$((n+1))
            done < ci-fail.txt
            exit 1
          fi

