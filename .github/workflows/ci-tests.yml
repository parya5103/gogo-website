name: CI Tests

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install test dependencies (eslint + Firebase rules plugin only)
        run: |
          mv package.json package.json.ci-backup
          mv package-lock.json package-lock.json.ci-backup
          npm install --no-save --no-package-lock --no-audit --no-fund eslint@^9.21.0 @firebase/eslint-plugin-security-rules
          mv package.json.ci-backup package.json
          mv package-lock.json.ci-backup package-lock.json

      - name: Run all repository test suites
        run: npm test
