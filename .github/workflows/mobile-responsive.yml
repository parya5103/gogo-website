name: Mobile Responsive Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'
  pull_request:
    paths:
      - 'tests/responsive/**'
      - 'playwright.config.js'
      - '.github/workflows/mobile-responsive.yml'
  push:
    branches: [main]
    paths:
      - 'tests/responsive/**'
      - 'playwright.config.js'
      - '.github/workflows/mobile-responsive.yml'

permissions:
  contents: read

concurrency:
  group: mobile-responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-responsive:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Run production mobile regression
        env:
          CI: true
          BASE_URL: https://gogocompany.in
        run: npx playwright test
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: mobile-responsive-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
