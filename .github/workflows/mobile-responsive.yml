name: Mobile Responsive Regression

on:
  workflow_dispatch:
  schedule:
    - cron: '30 2 * * 1'
  pull_request:
    paths:
      - 'tests/responsive/**'
      - 'playwright.config.js'
      - '.github/workflows/mobile-responsive.yml'
  push:
    branches: ['**']
    paths:
      - 'tests/responsive/**'
      - 'playwright.config.js'
      - '.github/workflows/mobile-responsive.yml'

permissions:
  contents: read

concurrency:
  group: mobile-responsive-${{ github.ref }}
  cancel-in-progress: true

jobs:
  chromium-responsive:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Install Playwright
        run: npm install --legacy-peer-deps --no-save --no-package-lock --no-audit --no-fund @playwright/test@1.56.1
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Start local static site from the pull request commit
        run: |
          node scripts/serve-static.mjs > /tmp/gogo-static.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then break; fi
            sleep 1
          done
          curl --fail http://127.0.0.1:4173/ > /dev/null
      - name: Run responsive regression against pull request files
        env:
          CI: true
          BASE_URL: http://127.0.0.1:4173
        run: npx playwright test
      - name: Upload failure evidence
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mobile-responsive-playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 7
