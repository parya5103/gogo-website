name: Refresh prerendered GoGo homepage feeds

on:
  push:
    branches: [main]
    paths:
      - 'sarkari-sarthi/jobs/job_manifest.json'
      - 'pikanews/data/latest.json'
      - 'pikanews/data/trending.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-products
  cancel-in-progress: false

jobs:
  refresh-homepage:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest central site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install locked build dependencies
        run: npm ci --no-audit --no-fund

      - name: Rebuild SSR homepage from current product feeds
        run: |
          npm run build:site
          node scripts/test-site-build.mjs

      - name: Commit homepage snapshot when changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html assets/gogo-home
          if git diff --cached --quiet; then
            echo "Homepage feed snapshot is already current."
          else
            git commit -m "build: refresh GoGo homepage feed snapshot"
            git pull --rebase --autostash origin main
            git push origin main
          fi
