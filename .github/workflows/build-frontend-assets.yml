name: Build frontend performance assets

on:
  push:
    branches:
      - main
      - perf/lighthouse-mobile-a11y-2026-11
    paths:
      - 'src/gogo-account.ts'
      - 'scripts/build-account-bundle.mjs'
      - 'assets/js/gogo-notifications.js'
      - 'assets/js/gogo-account.js'
      - 'assets/js/gogo-notifications.min.js'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - 'vite.config.js'
      - 'scripts/prerender-home.mjs'
      - 'scripts/publish-site-build.mjs'
      - 'scripts/test-site-build.mjs'
      - 'scripts/update-trending-seo.mjs'
      - 'scripts/validate-seo-build.mjs'
      - 'scripts/update-ai-hub.py'
      - 'scripts/test-ai-hub.py'
      - 'assets/js/main.js'
      - '.github/workflows/build-frontend-assets.yml'
  pull_request:
    branches: [main]
    paths:
      - 'src/gogo-account.ts'
      - 'scripts/build-account-bundle.mjs'
      - 'assets/js/gogo-notifications.js'
      - 'assets/js/gogo-account.js'
      - 'assets/js/gogo-notifications.min.js'
      - 'package.json'
      - 'package-lock.json'
      - 'frontend/**'
      - 'vite.config.js'
      - 'scripts/prerender-home.mjs'
      - 'scripts/publish-site-build.mjs'
      - 'scripts/test-site-build.mjs'
      - 'scripts/update-trending-seo.mjs'
      - 'scripts/validate-seo-build.mjs'
      - 'scripts/update-ai-hub.py'
      - 'scripts/test-ai-hub.py'
      - 'assets/js/main.js'
      - '.github/workflows/build-frontend-assets.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-products
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref }}

      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Build optimized browser bundles
        run: npm run build

      - name: Build and safely publish the prerendered React homepage
        run: npm run build:site

      - name: Validate GoGo AI Intelligence page and feeds
        run: |
          python3 -m py_compile scripts/update-ai-hub.py scripts/test-ai-hub.py
          python3 scripts/test-ai-hub.py

      - name: Run regression suite
        run: npm test

      - name: Commit generated browser bundles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json assets/js/gogo-account.js assets/js/gogo-notifications.min.js index.html assets/gogo-home
          if git diff --cached --quiet; then
            echo "Generated browser bundles are already up to date."
          else
            git commit -m "build: publish optimized account assets and prerendered homepage"
            # npm test/build helpers may leave tracked generated files outside the
            # publish allowlist. Clear those post-commit changes before rebasing.
            git reset --hard HEAD
            target_ref="${GITHUB_HEAD_REF:-$GITHUB_REF_NAME}"
            # AI content refreshes and other publishers may update main while
            # the frontend build is running. Rebase and retry instead of losing
            # either publisher's changes.
            for attempt in 1 2 3; do
              git fetch origin "$target_ref"
              if ! git rebase "origin/$target_ref"; then
                git rebase --abort || true
                echo "::error::Frontend build could not rebase cleanly onto $target_ref."
                exit 1
              fi
              if git push origin "HEAD:$target_ref"; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after a fresh fetch/rebase."
              sleep $((attempt * 5))
            done
            echo "::error::Could not publish frontend assets after 3 safe push attempts."
            exit 1
          fi
