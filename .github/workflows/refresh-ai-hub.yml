name: Refresh GoGo AI Intelligence Hub

on:
  schedule:
    - cron: '20 3 * * *' # Daily at 08:50 IST
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sync-products
  cancel-in-progress: false

jobs:
  refresh-ai-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest central site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Collect public AI news and model metadata
        run: |
          python -m py_compile scripts/update-ai-hub.py
          python scripts/update-ai-hub.py

      - name: Validate generated AI hub
        run: python scripts/test-ai-hub.py

      - name: Publish daily AI intelligence snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/index.html ai/feed.xml ai/data sitemap.xml
          if git diff --cached --quiet; then
            echo "AI Intelligence Hub is already current."
          else
            git commit -m "content: refresh daily GoGo AI Intelligence"
            git pull --rebase --autostash origin main
            git push origin main
          fi
