name: Refresh GoGo AI Intelligence Hub

on:
  schedule:
    - cron: '20 3 * * *' # Daily at 08:50 IST; dispatch on collector updates to regenerate the committed HTML snapshot.
  push:
    branches: [main]
    paths:
      - '.github/workflows/refresh-ai-hub.yml'
      - 'scripts/update-ai-hub.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gogo-ai-hub-refresh
  cancel-in-progress: false

jobs:
  refresh-ai-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout latest central site
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'

      - name: Collect public AI news and model metadata
        run: |
          python -m py_compile scripts/update-ai-hub.py
          python scripts/update-ai-hub.py

      - name: Validate generated AI hub
        run: python scripts/test-ai-hub.py

      - name: Publish daily AI intelligence snapshot
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ai/index.html ai/feed.xml ai/data sitemap.xml
          if git diff --cached --quiet; then
            echo "AI Intelligence Hub is already current."
          else
            git commit -m "content: refresh daily GoGo AI Intelligence"
            # Keep AI publishing independent from product sync queues. If another
            # publisher updates main at the same time, rebase and retry safely.
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                git rebase --abort || true
                echo "::error::AI refresh could not rebase cleanly onto main."
                exit 1
              fi
              if git push origin HEAD:main; then
                exit 0
              fi
              echo "Push attempt $attempt failed; retrying after a fresh fetch/rebase."
              sleep $((attempt * 5))
            done
            echo "::error::Could not publish AI snapshot after 3 safe push attempts."
            exit 1
          fi
