  <meta name="description" content="Sign in or create your shared GoGo Account to sync your profile and cloud saves across GoGo Games, Arrow Out, and Crystal Quest.">
  <meta name="robots" content="noindex, follow">
  <link rel="canonical" href="https://gogocompany.in/account/">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="GoGo Company">
  <meta property="og:title" content="GoGo Account &amp; Cloud Saves | GoGo Company">
  <meta property="og:description" content="Create one GoGo Account for GoGo Games, Arrow Out, and Crystal Quest with cloud save backup.">
  <meta property="og:url" content="https://gogocompany.in/account/">
  <meta property="og:image" content="https://gogocompany.in/arrowout/docs/screenshot-home.png">
  <meta name="theme-color" content="#0b1020">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="GoGo Account &amp; Cloud Saves | GoGo Company">
  <meta name="twitter:description" content="Sign in or create your shared GoGo Account to sync your profile and cloud saves across GoGo Games, Arrow Out, and Crystal Quest.">

<body data-page="account">
  <main class="page">
    <div class="container">
      <div class="page-head" style="text-align:center;max-width:640px;margin:0 auto 24px;">
        <span class="eyebrow">Unified Player Identity</span>
        <h1>GoGo Account &amp; Cloud Save</h1>
        <p class="lead">Sign in once to back up and restore your progress across GoGo Games, Arrow Out!, and Crystal Quest.</p>
      </div>
      <div id="gogo-account-page-root" role="main" aria-live="polite" aria-busy="true">
        <div class="gogo-account-card gogo-account-card-page" style="max-width:400px;margin:0 auto;text-align:center">
          <h2 class="gogo-account-title">Loading GoGo Account...</h2>
          <p class="gogo-account-subtitle">Initializing Firebase Authentication...</p>
          <div class="loading-skeleton" aria-hidden="true">
            <div class="skeleton-line" style="width:100%;height:16px;margin:8px 0;background:var(--border);border-radius:4px"></div>
            <div class="skeleton-line" style="width:80%;height:16px;margin:8px 0;background:var(--border);border-radius:4px"></div>
            <div class="skeleton-line" style="width:60%;height:16px;margin:8px 0;background:var(--border);border-radius:4px"></div>
          </div>
        </div>
      </div>
    </div>
  </main>
  <script src="../assets/js/main.js" defer></script>
  <script src="../assets/js/gogo-account.js" defer></script>
  <script src="../assets/js/gogo-notifications.js" defer></script>
